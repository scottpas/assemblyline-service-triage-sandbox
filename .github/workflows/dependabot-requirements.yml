name: Refresh Dependabot requirements export

on: # zizmor: ignore[dangerous-triggers] bot identity and PR metadata are validated before checkout
  # Run the trusted default-branch workflow after Dependabot's ordinary PR CI.
  # GITHUB_TOKEN pushes do not recursively trigger pull_request workflows.
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: dependabot-requirements-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate Dependabot pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.id == 49699333 &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      needs_export: ${{ steps.pr.outputs.needs_export }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Validate Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull-request number." >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          IFS=$'\t' read -r user_id user_login user_type head_repo head_ref head_sha base_ref base_sha < <(
            jq -r '[
              (.user.id | tostring),
              .user.login,
              .user.type,
              .head.repo.full_name,
              .head.ref,
              .head.sha,
              .base.ref,
              .base.sha
            ] | @tsv' <<< "$pr_json"
          )

          if [[ "$user_id" != "49699333" || "$user_login" != "dependabot[bot]" || "$user_type" != "Bot" ]]; then
            echo "Refusing to update a pull request not owned by the Dependabot bot." >&2
            exit 1
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$base_ref" != "main" ]]; then
            echo "Refusing to update an unexpected repository or base branch." >&2
            exit 1
          fi
          if [[ "$head_ref" != dependabot/* ]] || ! git check-ref-format "refs/heads/${head_ref}" >/dev/null; then
            echo "Invalid Dependabot head ref: $head_ref" >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ || ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull-request commit SHA." >&2
            exit 1
          fi

          needs_export=false
          while IFS= read -r filename; do
            if [[ "$filename" == "pyproject.toml" || "$filename" == "uv.lock" ]]; then
              needs_export=true
              break
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')

          {
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "needs_export=$needs_export"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

  export:
    name: Export requirements.txt
    needs: validate
    if: needs.validate.outputs.needs_export == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Dependabot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          persist-credentials: false

      - name: Read uv version
        id: uv-version
        run: |
          version="$(sed -n 's/^FROM ghcr.io\/astral-sh\/uv:\([0-9][0-9.]*\) AS uv$/\1/p' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid uv version in Dockerfile: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: false

      - name: Refresh requirements export
        id: export
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.validate.outputs.head_ref }}
        run: |
          uv export \
            --quiet \
            --locked \
            --no-dev \
            --no-emit-project \
            --output-file=requirements.txt

          if git diff --quiet -- requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore(deps): refresh requirements.txt"

          # Configure the ephemeral GITHUB_TOKEN only for the required push.
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_REF}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI for refreshed branch
        if: steps.export.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          HEAD_SHA: ${{ steps.export.outputs.head_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
        run: |
          gh workflow run ci.yml \
            --ref "$HEAD_REF" \
            -f pull_request_number="$PR_NUMBER" \
            -f base_ref="$BASE_SHA" \
            -f head_ref="$HEAD_SHA"
