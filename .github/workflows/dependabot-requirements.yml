name: Refresh Dependabot requirements export

on:
  # Dependabot's pull_request token is read-only. pull_request_target runs this
  # workflow from the trusted base branch so it can update Dependabot's branch.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - uv.lock

concurrency:
  group: dependabot-requirements-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  export:
    name: Export requirements.txt
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Refresh requirements export
        id: export
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --output-file=requirements.txt

          if git diff --quiet -- requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore(deps): refresh requirements.txt"
          git push origin "HEAD:${HEAD_REF}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI for refreshed branch
        if: steps.export.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ steps.export.outputs.head_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GITHUB_TOKEN pushes do not emit a new pull_request workflow run.
          # Dispatch CI explicitly so its checks apply to the generated commit.
          gh workflow run ci.yml \
            --ref "$HEAD_REF" \
            -f pull_request_number="$PR_NUMBER" \
            -f base_ref="$BASE_SHA" \
            -f head_ref="$HEAD_SHA"
