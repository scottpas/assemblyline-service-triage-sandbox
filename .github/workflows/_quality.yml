name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check; defaults to the caller's ref
        required: false
        type: string
        default: ""
      run_codecov:
        description: Upload coverage and test results through the Codecov workflow
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Token used to upload reports to Codecov
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      reports_available: ${{ steps.reports.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read uv version
        id: uv-version
        run: |
          version="$(sed -n 's/^FROM ghcr.io\/astral-sh\/uv:\([0-9][0-9.]*\) AS uv$/\1/p' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid uv version in Dockerfile: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libmagic1

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync ty check

      - name: Static security analysis
        run: uv run --no-sync bandit -c pyproject.toml -r src

      - name: Test
        run: >-
          uv run --no-sync pytest
          --cov=triage_sandbox
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Check Codecov reports
        id: reports
        if: ${{ inputs.run_codecov && !cancelled() }}
        run: |
          available=false
          if [[ -s coverage.xml && -s junit.xml ]]; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Upload Codecov reports
        if: ${{ !cancelled() && steps.reports.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error
          retention-days: 1

  codecov:
    name: Codecov
    needs: quality
    if: >-
      always() && !cancelled() && inputs.run_codecov &&
      needs.quality.outputs.reports_available == 'true'
    uses: ./.github/workflows/codecov.yml
    with:
      artifact_name: codecov-reports
      ref: ${{ inputs.ref }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
