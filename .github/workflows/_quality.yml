name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check; defaults to the caller's ref
        required: false
        type: string
        default: ""
      upload_coverage:
        description: Upload the generated coverage report to Codecov
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Token used to upload pull-request coverage to Codecov
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read uv version
        id: uv-version
        run: |
          version="$(sed -n 's/^FROM ghcr.io\/astral-sh\/uv:\([0-9][0-9.]*\) AS uv$/\1/p' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid uv version in Dockerfile: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Verify runtime dependency export
        run: |
          uv export \
            --quiet \
            --locked \
            --no-dev \
            --no-emit-project \
            --output-file=requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libmagic1

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync ty check

      - name: Static security analysis
        run: uv run --no-sync bandit -c pyproject.toml -r src

      - name: Test
        run: uv run --no-sync pytest --cov=triage_sandbox --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ inputs.upload_coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
