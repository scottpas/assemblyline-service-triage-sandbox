name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check; defaults to the caller's ref
        required: false
        type: string
        default: ""
      upload_reports:
        description: Upload coverage and JUnit reports as the codecov-reports artifact
        required: false
        type: boolean
        default: false
    outputs:
      reports_available:
        description: Whether the codecov-reports artifact was uploaded
        value: ${{ jobs.quality.outputs.reports_available }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, test, and audit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the service base image runtime; 3.14 is the upgrade target.
        python-version: ["3.11", "3.14"]
    timeout-minutes: 25
    env:
      # Overrides .python-version so uv uses the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    outputs:
      reports_available: ${{ steps.reports.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read uv version
        id: uv-version
        run: |
          version="$(sed -n 's/^FROM ghcr.io\/astral-sh\/uv:\([0-9][0-9.]*\) AS uv$/\1/p' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid uv version in Dockerfile: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libmagic1

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Pre-commit hooks
        # ty, uv-sync, ruff and bandit have dedicated steps; the remaining hooks (including pyupgrade) run here.
        env:
          SKIP: ty-check,uv-sync,ruff,ruff-format,bandit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync ty check --python-version ${{ matrix.python-version }}

      - name: Static security analysis
        run: uv run --no-sync bandit -c pyproject.toml -r src

      - name: Test
        run: >-
          uv run --no-sync pytest
          --cov=triage_sandbox
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Check Codecov reports
        id: reports
        # Only the 3.11 leg reports, so the matrix-level job output cannot be set by the 3.14 leg.
        if: ${{ inputs.upload_reports && matrix.python-version == '3.11' && !cancelled() }}
        run: |
          available=false
          if [[ -s coverage.xml && -s junit.xml ]]; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Upload Codecov reports
        # Only one leg uploads: the artifact name must be unique.
        if: ${{ !cancelled() && matrix.python-version == '3.11' && steps.reports.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error
          retention-days: 1
