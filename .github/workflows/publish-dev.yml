name: Publish dev release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
      upload_reports: true

  codecov:
    name: Codecov
    needs: quality
    if: ${{ always() && !cancelled() && needs.quality.outputs.reports_available == 'true' }}
    uses: ./.github/workflows/codecov.yml
    with:
      ref: ${{ github.sha }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish dev
    needs: quality
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      channel: dev
      ref: ${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
