name: Codecov main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  upload:
    name: Coverage and Test Analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read uv version
        id: uv-version
        run: |
          version="$(sed -n 's/^FROM ghcr.io\/astral-sh\/uv:\([0-9][0-9.]*\) AS uv$/\1/p' Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid uv version in Dockerfile: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libmagic1

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Run tests
        run: >-
          uv run --no-sync pytest
          --cov=triage_sandbox
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./junit.xml
          disable_search: true
          fail_ci_if_error: true
