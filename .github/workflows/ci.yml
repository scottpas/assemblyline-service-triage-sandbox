name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml
    with:
      # Dependabot PRs cannot read the Codecov token, so they skip the upload.
      upload_reports: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

  codecov:
    name: Codecov
    needs: quality
    if: ${{ always() && !cancelled() && needs.quality.outputs.reports_available == 'true' }}
    uses: ./.github/workflows/codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  container:
    name: Container build and smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read compatibility version
        id: version
        run: |
          ASSEMBLYLINE_VERSION="$(sed -n 's/^ASSEMBLYLINE_VERSION=//p' .release-version)"
          SERVICE_MAJOR="$(sed -n 's/^SERVICE_MAJOR=//p' .release-version)"
          if [[ ! "$ASSEMBLYLINE_VERSION" =~ ^[0-9]+\.[0-9]+$ || ! "$SERVICE_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Invalid values in .release-version" >&2
            exit 1
          fi
          echo "version=${ASSEMBLYLINE_VERSION}.${SERVICE_MAJOR}.dev0" >> "$GITHUB_OUTPUT"

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=latest
          tags: local/triage-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test-image.sh local/triage-sandbox:ci "$VERSION"
