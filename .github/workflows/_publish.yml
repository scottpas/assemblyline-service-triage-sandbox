name: Publish image

on:
  workflow_call:
    inputs:
      channel:
        description: Assemblyline update channel
        required: true
        type: string
      ref:
        description: Git ref to publish
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub access token
        required: true
concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.channel }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dockerhub
    steps:
      - name: Validate channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" != "dev" && "$CHANNEL" != "stable" ]]; then
            echo "Unsupported channel: $CHANNEL" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate release version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          ASSEMBLYLINE_VERSION="$(sed -n 's/^ASSEMBLYLINE_VERSION=//p' .release-version)"
          SERVICE_MAJOR="$(sed -n 's/^SERVICE_MAJOR=//p' .release-version)"

          if [[ ! "$ASSEMBLYLINE_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Assemblyline version: $ASSEMBLYLINE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$SERVICE_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Invalid service major version: $SERVICE_MAJOR" >&2
            exit 1
          fi

          prefix="v${ASSEMBLYLINE_VERSION}.${SERVICE_MAJOR}.${CHANNEL}"
          latest="$(git tag --list "${prefix}[0-9]*" --sort=-version:refname | head -n 1)"
          if [[ -n "$latest" ]]; then
            minor="${latest#${prefix}}"
            if [[ ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Invalid existing release tag: $latest" >&2
              exit 1
            fi
            minor=$((10#$minor + 1))
          else
            minor=0
          fi

          version="${ASSEMBLYLINE_VERSION}.${SERVICE_MAJOR}.${CHANNEL}${minor}"
          git_tag="v${version}"
          if [[ ! "$git_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(dev|stable)[0-9]+$ ]]; then
            echo "Generated tag does not match the required format: $git_tag" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "git_tag=$git_tag"
            echo "tag_prefix=$prefix"
            echo "commit=$(git rev-parse HEAD)"
            if [[ "$CHANNEL" == "dev" ]]; then
              echo "base_tag=latest"
            else
              echo "base_tag=stable"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prevent duplicate stable release
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.version.outputs.commit }}
          TAG_PREFIX: ${{ steps.version.outputs.tag_prefix }}
        run: |
          latest_stable="$(git tag --list "${TAG_PREFIX}[0-9]*" --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_stable" && "$(git rev-list -n 1 "$latest_stable")" == "$COMMIT" ]]; then
            if gh release view "$latest_stable" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "The current main commit is already released as $latest_stable" >&2
            else
              echo "$latest_stable was reserved by a run that did not finish; delete the tag and re-run." >&2
            fi
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ steps.version.outputs.base_tag }}
          tags: ${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test-image.sh "${GITHUB_REPOSITORY}:${VERSION}" "$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure image tag is unused
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="docker.io/${GITHUB_REPOSITORY}:${VERSION}"
          if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            echo "$image already exists on Docker Hub; refusing to overwrite it." >&2
            exit 1
          fi
          if ! grep -qi "not found" <<< "$output"; then
            echo "Could not check whether $image exists:" >&2
            echo "$output" >&2
            exit 1
          fi

      # Reserving the tag before pushing means a failed run can never hand the
      # same version to a later run and overwrite an image that was already pushed.
      - name: Reserve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.version.outputs.commit }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${GIT_TAG}" \
            -f sha="$COMMIT" > /dev/null

      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ steps.version.outputs.base_tag }}
          tags: docker.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Export SBOM
        env:
          IMAGE: docker.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM.SPDX }}' > "sbom-${VERSION}.spdx.json"
          jq -e '.spdxVersion' "sbom-${VERSION}.spdx.json" > /dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=("$GIT_TAG" --verify-tag --generate-notes --title "$GIT_TAG")

          # Start notes at the previous release on this channel; by default GitHub
          # uses the latest release, which for stable is usually a dev release.
          previous="$(
            gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 \
              --json tagName,createdAt \
              --jq "[.[] | select(.tagName | test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+\\\\.${CHANNEL}[0-9]+\$\"))]
                    | sort_by(.createdAt) | last | .tagName // empty"
          )"
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi

          if [[ "$CHANNEL" == "dev" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "sbom-${VERSION}.spdx.json"
