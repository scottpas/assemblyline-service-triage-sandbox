name: Publish image

on:
  workflow_call:
    inputs:
      channel:
        description: Assemblyline update channel
        required: true
        type: string
      ref:
        description: Git ref to publish
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub access token
        required: true
concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.channel }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dockerhub
    steps:
      - name: Validate channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" != "dev" && "$CHANNEL" != "stable" ]]; then
            echo "Unsupported channel: $CHANNEL" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          ASSEMBLYLINE_VERSION="$(sed -n 's/^ASSEMBLYLINE_VERSION=//p' .release-version)"
          SERVICE_MAJOR="$(sed -n 's/^SERVICE_MAJOR=//p' .release-version)"

          if [[ ! "$ASSEMBLYLINE_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Assemblyline version: $ASSEMBLYLINE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$SERVICE_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Invalid service major version: $SERVICE_MAJOR" >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          prefix="v${ASSEMBLYLINE_VERSION}.${SERVICE_MAJOR}.${CHANNEL}"

          tag_minor() {
            local minor="${1#"${prefix}"}"
            if [[ ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Invalid existing release tag: $1" >&2
              exit 1
            fi
            echo "$((10#$minor))"
          }

          # A tag already on this commit means an earlier run reserved it. Finish
          # that release unless it was published (a draft is left behind when
          # `gh release create` fails part-way).
          resume=false
          current="$(git tag --list "${prefix}[0-9]*" --points-at "$commit" --sort=-version:refname | head -n 1)"
          if [[ -n "$current" ]]; then
            is_draft="$(gh release view "$current" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$is_draft" == "false" ]]; then
              echo "This commit is already released as $current" >&2
              exit 1
            fi
            echo "Resuming unfinished release $current"
            resume=true
            minor="$(tag_minor "$current")"
          else
            latest="$(git tag --list "${prefix}[0-9]*" --sort=-version:refname | head -n 1)"
            if [[ -n "$latest" ]]; then
              if ! git merge-base --is-ancestor "$latest" "$commit"; then
                echo "$latest is newer than this commit; refusing to publish older code as a later version." >&2
                exit 1
              fi
              latest_minor="$(tag_minor "$latest")"
              minor=$((latest_minor + 1))
            else
              minor=0
            fi
          fi

          version="${ASSEMBLYLINE_VERSION}.${SERVICE_MAJOR}.${CHANNEL}${minor}"
          git_tag="v${version}"
          if [[ ! "$git_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(dev|stable)[0-9]+$ ]]; then
            echo "Generated tag does not match the required format: $git_tag" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "git_tag=$git_tag"
            echo "commit=$commit"
            echo "resume=$resume"
            if [[ "$CHANNEL" == "dev" ]]; then
              echo "base_tag=latest"
            else
              echo "base_tag=stable"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ steps.version.outputs.base_tag }}
          tags: ${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test-image.sh "${GITHUB_REPOSITORY}:${VERSION}" "$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        env:
          RESUME: ${{ steps.version.outputs.resume }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="docker.io/${GITHUB_REPOSITORY}:${VERSION}"
          if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            if [[ "$RESUME" != "true" ]]; then
              echo "$image already exists on Docker Hub; refusing to overwrite it." >&2
              exit 1
            fi
            # Only a run for this commit can reserve this tag, so the image was
            # pushed by an earlier attempt of this release.
            echo "Reusing $image pushed by the unfinished release"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qi "not found" <<< "$output"; then
            echo "Could not check whether $image exists:" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      # Reserving the tag before pushing means a failed run can never hand the
      # same version to a later run and overwrite an image that was already pushed.
      - name: Reserve release tag
        if: ${{ steps.version.outputs.resume != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.version.outputs.commit }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${GIT_TAG}" \
            -f sha="$COMMIT" > /dev/null

      - name: Push image
        if: ${{ steps.existing.outputs.pushed != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ steps.version.outputs.base_tag }}
          tags: docker.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Export SBOM
        env:
          IMAGE: docker.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM.SPDX }}' > "sbom-${VERSION}.spdx.json"
          jq -e '.spdxVersion' "sbom-${VERSION}.spdx.json" > /dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ steps.version.outputs.commit }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$(gh release view "$GIT_TAG" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            echo "Deleting draft left by an earlier attempt"
            gh release delete "$GIT_TAG" --yes
          fi

          args=("$GIT_TAG" --verify-tag --generate-notes --title "$GIT_TAG")

          # Start notes at the previous published release on this channel that is an
          # ancestor of this commit; by default GitHub uses the latest release,
          # which for stable is usually a dev release.
          while read -r candidate; do
            if [[ "$candidate" != "$GIT_TAG" &&
                  "$(gh release view "$candidate" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
              args+=(--notes-start-tag "$candidate")
              break
            fi
          done < <(git tag --list "v*.${CHANNEL}[0-9]*" --merged "$COMMIT" --sort=-version:refname)

          if [[ "$CHANNEL" == "dev" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "sbom-${VERSION}.spdx.json"
