name: Codecov

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact containing coverage and JUnit XML reports
        required: false
        type: string
        default: codecov-reports
      ref:
        description: Git ref associated with the reports
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: Token used to upload reports to Codecov
        required: false

permissions:
  contents: read

jobs:
  upload:
    name: Coverage and Test Analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Codecov reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
